name: Link Rot Monitoring

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  check-external-links:
    name: Check External Links for Rot
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation
        run: pnpm run build

      - name: Check external links
        run: pnpm run check:links:external
        env:
          # Longer timeout for external checks
          TIMEOUT: 10000
          MAX_CONCURRENT: 3

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'link-rot'
            });
            
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔗 Link Rot Detected - External Links Need Attention',
                body: `External link checking failed in scheduled job [${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).

                Please review the logs and fix broken external links in the documentation.
                
                To reproduce locally:
                \`\`\`bash
                pnpm run check:links:external
                \`\`\`
                `,
                labels: ['link-rot', 'ci', 'documentation']
              });
            }
