name: Preview Deployment

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  preview-deploy:
    name: Deploy Preview
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      deployments: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Create deployment
        uses: actions/deployments@v4
        id: deployment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: preview-${{ github.event.pull_request.number }}
          ref: ${{ github.event.pull_request.head.sha }}
          auto_inactive: true
          logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Start preview server
        run: |
          pnpm run start &
          echo $! > server.pid
          sleep 10

      - name: Run smoke tests
        run: |
          # Wait for server to be ready
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Server is ready"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done

          # Test key pages
          curl -f http://localhost:3000 > /dev/null || exit 1
          curl -f http://localhost:3000/docs/getting-started/introduction > /dev/null || exit 1
          curl -f http://localhost:3000/docs/hooks > /dev/null || exit 1
          echo "✅ Smoke tests passed"

      - name: Stop preview server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
            rm server.pid
          fi

      - name: Update deployment status to success
        if: success()
        uses: actions/deployments@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          state: success
          environment_url: http://localhost:3000
          environment: preview-${{ github.event.pull_request.number }}

      - name: Update deployment status to failure
        if: failure()
        uses: actions/deployments@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          state: failure
          environment: preview-${{ github.event.pull_request.number }}

      - name: Comment PR with preview info
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Preview Deployment')
            );
            
            const commentBody = `## 🚀 Preview Deployment
            
            A preview deployment has been created for this PR.
            
            **Build:** #${context.runNumber}
            **Commit:** \`${context.sha.substring(0, 7)}\`
            
            ### Smoke Tests
            ✅ Homepage
            ✅ Getting Started
            ✅ Hooks Documentation
            
            > Note: This is a local preview. For cloud preview deployments, configure Vercel/Netlify integration.
            
            ---
            
            *To test locally:*
            \`\`\`bash
            git checkout ${context.event.pull_request.head.ref}
            pnpm install
            pnpm run build
            pnpm run start
            \`\`\`
            `;
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }
