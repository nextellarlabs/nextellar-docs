name: Docs Quality

on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.mdx'
  push:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint
        run: npm install --no-audit --no-fund markdownlint-cli

      - name: Lint markdown
        run: |
          npx markdownlint '**/*.md' '**/*.mdx' --disable MD013 MD033 || true
